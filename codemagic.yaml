workflows:

  # ── iOS: chỉ build khi tag ─────────────────────────────────────────────────
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60

    environment:
      flutter: 3.19.0
      xcode: 15.3
      cocoapods: default
      groups:
        - apple_credentials       # tạo trong Codemagic → Teams → Environment variables
      vars:
        BUNDLE_ID: "com.ijin.filekit_pro"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.filekitpro

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Flutter pub get
        script: flutter packages pub get

      - name: Pod install
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_URL=$API_URL

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key:   $APP_STORE_CONNECT_PRIVATE_KEY
        key_id:    $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ── Android: build khi tag ─────────────────────────────────────────────────
  android-release:
    name: Android Release (Google Play)
    max_build_duration: 30

    environment:
      flutter: 3.19.0

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Flutter pub get
        script: flutter packages pub get

      - name: Build APK & AAB
        script: |
          flutter build apk --release \
            --dart-define=API_URL=$API_URL
          flutter build appbundle --release \
            --dart-define=API_URL=$API_URL

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - trminh18122022@email.com